[package]
name = "majra-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Majra transfer core: probing, range planning, multi-connection downloads and resumable state."

[dependencies]
bytes = "1"
crc32fast = "1"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
if-addrs = "0.13"
log = "0.4"
percent-encoding = "2"
# native-tls uses SChannel on Windows: no extra C toolchain, and it keeps the TLS
# fingerprint closer to the system browser, which some file hosts require.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
crc32fast = "1"
env_logger = "0.11"
tempfile = "3"
